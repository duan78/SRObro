<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRObro - Test Modèles GLB Réels</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #eee;
            overflow: hidden;
        }

        #renderCanvas {
            width: 100%;
            height: 100vh;
            touch-action: none;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid #444;
            border-radius: 8px;
            max-height: 90vh;
            overflow-y: auto;
            max-width: 400px;
        }

        h1 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #4CAF50;
        }

        .section {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #444;
        }

        .section:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        label {
            display: block;
            margin: 5px 0;
            font-size: 12px;
            color: #aaa;
        }

        select, button, input {
            width: 100%;
            padding: 8px;
            background: #2d2d44;
            border: 1px solid #444;
            border-radius: 4px;
            color: #eee;
            font-size: 13px;
            cursor: pointer;
            margin: 2px 0;
        }

        select:hover, button:hover {
            background: #3d3d5c;
            border-color: #666;
        }

        button:active {
            background: #4CAF50;
            border-color: #4CAF50;
        }

        button.primary {
            background: #2196F3;
        }

        button.primary:hover {
            background: #1976D2;
        }

        button.danger {
            background: #f44336;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            margin: 5px 0;
        }

        .checkbox-group input {
            width: auto;
            margin-right: 8px;
        }

        .checkbox-group label {
            margin: 0;
            flex: 1;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            font-size: 11px;
        }

        .stat {
            display: flex;
            justify-content: space-between;
            padding: 4px 8px;
            background: #2d2d44;
            border-radius: 4px;
        }

        .stat-value {
            color: #4CAF50;
            font-weight: bold;
        }

        #logs {
            max-height: 200px;
            overflow-y: auto;
            font-size: 11px;
            font-family: 'Consolas', monospace;
        }

        .log-entry {
            padding: 3px 0;
            border-bottom: 1px solid #333;
        }

        .log-success { color: #4CAF50; }
        .log-error { color: #f44336; }
        .log-warn { color: #ff9800; }
        .log-info { color: #2196F3; }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>

    <div id="ui">
        <h1>🎮 Test Modèles GLB Réels</h1>

        <div class="section">
            <label>Map ID</label>
            <select id="mapSelect">
                <option value="100">100 (Zone de départ)</option>
                <option value="101">101</option>
                <option value="102">102</option>
                <option value="68">68</option>
            </select>
        </div>

        <div class="section">
            <label>Max Modèles (1-100)</label>
            <input type="range" id="maxModels" min="1" max="100" value="20">
            <label id="maxModelsLabel">20 modèles</label>
        </div>

        <div class="section">
            <button id="loadMapBtn" class="primary">📥 Charger Map + Modèles</button>
            <button id="clearModelsBtn" class="danger">🗑️ Effacer Modèles</button>
        </div>

        <div class="section">
            <div class="checkbox-group">
                <input type="checkbox" id="autoRotateCheck" checked>
                <label for="autoRotateCheck">Auto-rotation</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="showNormalsCheck">
                <label for="showNormalsCheck">Afficher normales</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="showBoundsCheck">
                <label for="showBoundsCheck">Afficher bounds</label>
            </div>
        </div>

        <div class="section">
            <h3 style="font-size: 13px; color: #aaa; margin: 10px 0;">📊 Statistiques</h3>
            <div class="stats">
                <div class="stat">
                    <span>FPS:</span>
                    <span class="stat-value" id="fps">0</span>
                </div>
                <div class="stat">
                    <span>Draw Calls:</span>
                    <span class="stat-value" id="drawCalls">0</span>
                </div>
                <div class="stat">
                    <span>Vertices:</span>
                    <span class="stat-value" id="vertices">0</span>
                </div>
                <div class="stat">
                    <span>Triangles:</span>
                    <span class="stat-value" id="triangles">0</span>
                </div>
                <div class="stat">
                    <span>Textures:</span>
                    <span class="stat-value" id="textures">0</span>
                </div>
                <div class="stat">
                    <span>Modèles:</span>
                    <span class="stat-value" id="models">0</span>
                </div>
            </div>
        </div>

        <div class="section">
            <h3 style="font-size: 13px; color: #aaa; margin: 10px 0;">📋 Logs</h3>
            <div id="logs"></div>
        </div>
    </div>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>

    <script>
        // Variables globales
        let canvas, engine, scene;
        let camera = null;
        let currentMap = null;
        let loadedModels = [];
        let autoRotate = true;
        let maxModels = 20;

        // Liste de modèles GLB disponibles
        const availableModels = [
            '../../assets/glb Converted/prim/avatar_m_nasrun.glb',
            '../../assets/glb Converted/prim/avatar_m_nasrun02.glb',
            '../../assets/glb Converted/prim/avatar_w_nasrun.glb',
            '../../assets/glb Converted/prim/avatar_w_nasrun02.glb',
            '../../assets/glb Converted/prim/mesh/cos/ch_guard01.glb',
            '../../assets/glb Converted/prim/mesh/cos/ch_guard_bow.glb',
            '../../assets/glb Converted/prim/mesh/cos/ch_guard_spear.glb',
            '../../assets/glb Converted/prim/mesh/cos/eu_guard01.glb',
            '../../assets/glb Converted/prim/mesh/cos/is_guard01.glb',
            '../../assets/glb Converted/prim/mesh/cos/fortress_catapult_01.glb',
            '../../assets/glb Converted/res/bldg/china/dunhuang/association/w_cd_hunter_01.glb',
            '../../assets/glb Converted/res/bldg/china/dunhuang/association/w_cd_hunter_02.glb',
            '../../assets/glb Converted/res/nature/oasis/tarim/oas_tarim_hand.glb',
            '../../assets/glb Converted/prim/mtrl/nature/europe/east eurpoe/garden/euro_grs_weed01.glb',
            '../../assets/glb Converted/prim/mtrl/item/china/weapon/tblade_09.glb'
        ];

        // Initialisation
        async function init() {
            canvas = document.getElementById('renderCanvas');
            engine = new BABYLON.Engine(canvas, true);

            scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color3(0.1, 0.1, 0.18);

            // Caméra avec contrôles améliorés
            camera = new BABYLON.ArcRotateCamera(
                'camera',
                -Math.PI / 2,
                Math.PI / 2.5,
                300,
                new BABYLON.Vector3(1280, 0, 1280),
                scene
            );
            camera.attachControl(canvas, true);
            camera.wheelPrecision = 50;
            camera.lowerRadiusLimit = 50;
            camera.upperRadiusLimit = 2000;
            camera.checkCollisions = true;

            // Lumières
            const hemiLight = new BABYLON.HemisphericLight('hemiLight', new BABYLON.Vector3(0, 1, 0), scene);
            hemiLight.intensity = 0.6;

            const dirLight = new BABYLON.DirectionalLight('dirLight', new BABYLON.Vector3(-1, -2, -1), scene);
            dirLight.position = new BABYLON.Vector3(500, 1000, 500);
            dirLight.intensity = 0.8;
            dirLight.shadowEnabled = true;

            // Ground par défaut
            const defaultGround = BABYLON.MeshBuilder.CreateGround(
                'defaultGround',
                { width: 3000, height: 3000 },
                scene
            );
            const groundMat = new BABYLON.StandardMaterial('defaultGroundMat', scene);
            groundMat.diffuseColor = new BABYLON.Color3(0.2, 0.25, 0.2);
            groundMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
            groundMat.backFaceCulling = false;
            defaultGround.material = groundMat;
            defaultGround.position.y = -2;
            defaultGround.receiveShadows = true;

            // Setup UI events
            setupUIEvents();

            // Boucle de rendu
            engine.runRenderLoop(() => {
                if (autoRotate) {
                    camera.alpha += 0.001;
                }
                scene.render();

                // Update stats
                updateStats();
            });

            log('✅ Scene initialisée', 'success');
        }

        function setupUIEvents() {
            document.getElementById('loadMapBtn').addEventListener('click', loadMapWithModels);
            document.getElementById('clearModelsBtn').addEventListener('click', clearModels);
            document.getElementById('autoRotateCheck').addEventListener('change', (e) => {
                autoRotate = e.target.checked;
            });
            document.getElementById('showNormalsCheck').addEventListener('change', (e) => {
                scene.meshes.forEach(mesh => {
                    if (mesh.showNormals !== undefined) {
                        mesh.showNormals = e.target.checked;
                    }
                });
                log(`📐 Normales: ${e.target.checked ? 'activées' : 'désactivées'}`, 'info');
            });
            document.getElementById('showBoundsCheck').addEventListener('change', (e) => {
                scene.meshes.forEach(mesh => {
                    mesh.showBoundingBox = e.target.checked;
                });
                log(`📦 Bounds: ${e.target.checked ? 'activés' : 'désactivés'}`, 'info');
            });
            document.getElementById('maxModels').addEventListener('input', (e) => {
                maxModels = parseInt(e.target.value);
                document.getElementById('maxModelsLabel').textContent = `${maxModels} modèles`;
            });
        }

        async function loadMapWithModels() {
            const mapId = document.getElementById('mapSelect').value;

            log(`🗺️  Chargement map ${mapId} avec modèles GLB...`, 'info');

            try {
                // Charger le heightmap
                const heightmapPath = `../../assets/maps_heightmap/${mapId}/${mapId}.json`;
                const response = await fetch(heightmapPath);

                if (!response.ok) {
                    throw new Error(`Heightmap not found: ${heightmapPath}`);
                }

                const heightmap = await response.json();
                log(`   ✅ Heightmap: ${heightmap.metadata.width}x${heightmap.metadata.height}`, 'success');

                // Créer le terrain
                if (currentMap) {
                    currentMap.dispose();
                }

                currentMap = createGroundFromHeightmap(mapId, heightmap);

                // Charger les objets
                const objectsPath = `../../assets/maps_objects/${mapId}/${mapId}.o2.json`;
                const objResponse = await fetch(objectsPath);

                if (objResponse.ok) {
                    const objectFile = await objResponse.json();
                    log(`   ✅ Objets trouvés: ${objectFile.objects.length}`, 'success');

                    // Placer les modèles GLB
                    await placeRealModels(objectFile.objects);
                }

                log(`✅ Map ${mapId} chargée avec succès!`, 'success');

            } catch (error) {
                log(`❌ Erreur: ${error.message}`, 'error');
                console.error(error);
            }
        }

        function createGroundFromHeightmap(mapId, heightmap) {
            const { width, height, min, max } = heightmap.metadata;
            const { data } = heightmap;

            log(`   📐 Création terrain...`, 'info');

            const range = max - min || 1;
            const scale = 100;
            const subdivisions = width - 1;

            const ground = BABYLON.MeshBuilder.CreateGround(
                `${mapId}_ground`,
                {
                    width: width * 10,
                    height: height * 10,
                    subdivisionsX: subdivisions,
                    subdivisionsY: subdivisions
                },
                scene
            );

            const positions = ground.getVerticesData(BABYLON.VertexBuffer.PositionKind);

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const heightValue = data[y][x];
                    const normalizedHeight = (heightValue - min) / range;
                    const worldHeight = normalizedHeight * scale;

                    const i = y * width + x;
                    positions[i * 3 + 1] = worldHeight;
                }
            }

            ground.updateVerticesData(BABYLON.VertexBuffer.PositionKind, positions);

            // Calculer les normales pour un éclairage correct
            BABYLON.VertexData.ComputeNormals(positions, ground.getIndices(), ground.getVerticesData(BABYLON.VertexBuffer.NormalKind));

            const groundMat = new BABYLON.StandardMaterial(`${mapId}_groundMat`, scene);
            groundMat.diffuseColor = new BABYLON.Color3(0.3, 0.45, 0.3);
            groundMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
            groundMat.roughness = 0.8;
            ground.material = groundMat;
            ground.receiveShadows = true;

            log(`   ✅ Terrain créé`, 'success');

            return ground;
        }

        async function placeRealModels(objects) {
            log(`   🎯 Placement des modèles GLB...`, 'info');

            const objectsToPlace = objects.slice(0, maxModels);
            let loaded = 0;
            let failed = 0;

            for (const obj of objectsToPlace) {
                try {
                    // Sélectionner un modèle aléatoire
                    const modelPath = availableModels[Math.floor(Math.random() * availableModels.length)];

                    // Charger le modèle
                    const result = await BABYLON.SceneLoader.ImportMeshAsync(
                        null,
                        '',
                        modelPath,
                        scene
                    );

                    // Positionner le modèle
                    const rootMesh = result.meshes[0];
                    rootMesh.position = new BABYLON.Vector3(
                        obj.position.x * 10,
                        obj.position.y * 10,
                        obj.position.z * 10
                    );

                    // Rotation
                    if (obj.rotation) {
                        rootMesh.rotation = new BABYLON.Vector3(
                            obj.rotation.x,
                            obj.rotation.y,
                            obj.rotation.z
                        );
                    }

                    // Scale
                    if (obj.scale) {
                        rootMesh.scaling = new BABYLON.Vector3(
                            obj.scale.x,
                            obj.scale.y,
                            obj.scale.z
                        );
                    } else {
                        rootMesh.scaling = new BABYLON.Vector3(1, 1, 1);
                    }

                    // Activer les shadows
                    result.meshes.forEach(mesh => {
                        mesh.receiveShadows = true;
                        if (mesh.id !== rootMesh.id) {
                            mesh.parent = rootMesh;
                        }
                    });

                    loadedModels.push(rootMesh);
                    loaded++;

                } catch (error) {
                    failed++;
                    // Créer un fallback (cube rouge) si le chargement échoue
                    const fallback = BABYLON.MeshBuilder.CreateBox(
                        `fallback_${obj.id}`,
                        { size: 3 },
                        scene
                    );
                    fallback.position = new BABYLON.Vector3(
                        obj.position.x * 10,
                        obj.position.y * 10 + 2,
                        obj.position.z * 10
                    );

                    const fallbackMat = new BABYLON.StandardMaterial(`fallbackMat_${obj.id}`, scene);
                    fallbackMat.diffuseColor = new BABYLON.Color3(1, 0.2, 0.2);
                    fallbackMat.alpha = 0.8;
                    fallback.material = fallbackMat;

                    loadedModels.push(fallback);
                }

                // Afficher la progression
                if ((loaded + failed) % 5 === 0) {
                    log(`   📦 Progression: ${loaded + failed}/${objectsToPlace.length} (✅${loaded} ❌${failed})`, 'info');
                }
            }

            log(`   ✅ Modèles chargés: ${loaded} réussis, ${failed} échecs`, 'success');
            updateStats();
        }

        function clearModels() {
            loadedModels.forEach(model => {
                model.dispose();
            });
            loadedModels = [];

            log('🗑️  Tous les modèles effacés', 'info');
            updateStats();
        }

        function updateStats() {
            if (!scene) return;

            document.getElementById('fps').textContent = engine.getFps().toFixed(0);
            document.getElementById('drawCalls').textContent = scene.getActiveIndices() ?
                (scene.getTotalVertices() / 3).toFixed(0) : '0';
            document.getElementById('vertices').textContent = scene.getTotalVertices().toLocaleString();
            document.getElementById('triangles').textContent =
                (scene.getActiveIndices() ? scene.getTotalVertices() / 3 : 0).toLocaleString();
            document.getElementById('textures').textContent =
                scene.textures ? scene.textures.length : 0;
            document.getElementById('models').textContent = loadedModels.length;
        }

        function log(message, type = 'info') {
            const logs = document.getElementById('logs');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = message;
            logs.appendChild(entry);
            logs.scrollTop = logs.scrollHeight;

            console.log(message);
        }

        // Lancer l'initialisation
        init();
    </script>
</body>
</html>
