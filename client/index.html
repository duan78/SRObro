<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SRObro - Silkroad Online WebGL Clone" />
    <title>SRObro - Silkroad Online WebGL</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background: #000;
      }

      #renderCanvas {
        width: 100%;
        height: 100%;
        touch-action: none;
        outline: none;
      }

      /* ============ HUD DOM OVERLAY (style Silkroad) ============ */
      #hud {
        position: fixed;
        inset: 0;
        z-index: 500;
        pointer-events: none;
        color: #f0e6d2;
        font-size: 13px;
        user-select: none;
      }
      .hud-panel {
        position: absolute;
        background: linear-gradient(180deg, rgba(20,16,8,0.82), rgba(8,6,3,0.88));
        border: 1px solid #8a6d2f;
        border-radius: 4px;
        box-shadow: 0 0 0 1px rgba(0,0,0,0.6), inset 0 0 12px rgba(255,215,0,0.06);
        padding: 8px 10px;
      }
      .hud-hidden { display: none !important; }
      #hud-charframe { top: 12px; left: 12px; width: 230px; }
      #hud-targetframe { top: 12px; left: 50%; transform: translateX(-50%); width: 220px; }
      #hud-minimap { top: 12px; right: 12px; width: 150px; text-align: center; }
      #hud-hotbar { bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 5px; padding: 6px 8px; }
      #hud-chat { bottom: 12px; left: 12px; width: 330px; }
      .hud-name-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
      .hud-name-row #hud-name, .hud-name-row #hud-target-name { color: #ffd700; font-weight: 600; text-shadow: 0 1px 2px #000; }
      .hud-level { color: #f0e6d2; font-size: 11px; }
      .hud-bar { position: relative; height: 14px; background: #1c1810; border: 1px solid #55461f; border-radius: 2px; margin: 3px 0; overflow: hidden; }
      .hud-fill { height: 100%; width: 50%; transition: width 0.25s ease; }
      .hud-bar-hp .hud-fill { background: linear-gradient(180deg, #e04545, #8f1d1d); }
      .hud-bar-mp .hud-fill { background: linear-gradient(180deg, #4a7fd0, #1d3c8f); }
      .hud-bar-exp .hud-fill { background: linear-gradient(180deg, #d0b34a, #8f751d); }
      .hud-bar-target .hud-fill { background: linear-gradient(180deg, #d04545, #7f1d1d); }
      .hud-bar-text { position: absolute; inset: 0; text-align: center; font-size: 10px; line-height: 14px; color: #fff; text-shadow: 0 1px 1px #000; }
      .hud-gold-row { margin-top: 4px; font-size: 11px; color: #ffd700; }
      .hud-slot { width: 40px; height: 40px; background: rgba(30,24,12,0.9); border: 1px solid #8a6d2f; border-radius: 3px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
      .hud-slot:hover { border-color: #d4af37; }
      .hud-slot-key { color: #c9b98a; font-size: 12px; font-weight: 600; text-shadow: 0 1px 2px #000; z-index: 2; }
      .hud-slot-icon { position: absolute; inset: 2px; background-size: cover; background-position: center; border-radius: 2px; }
      .hud-slot-cd { position: absolute; inset: 0; z-index: 3; pointer-events: none; border-radius: 3px; }
      #hud-chat-log { max-height: 140px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
      .hud-chat-line { text-shadow: 0 1px 1px #000; line-height: 1.45; }
      .hud-chat-system { color: #ffd700; }
      .hud-chat-say { color: #e8e8e8; }
      .hud-chat-combat { color: #ff9a76; }
      .hud-chat-party { color: #7fd4ff; }
      .hud-chat-guild { color: #7fff9e; }
      .hud-chat-union { color: #d29bff; }
      .hud-chat-whisper { color: #ffb0e0; font-style: italic; }
      .hud-chat-whisper_sent { color: #c9a0c0; font-style: italic; }
      #hud-chat-hint { margin-top: 4px; font-size: 10px; color: #8a7d5c; }
      #hud-coords { font-size: 11px; color: #c9b98a; }

      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        transition: opacity 0.5s ease;
      }

      #loading-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .loading-logo {
        font-size: 4rem;
        font-weight: bold;
        color: #ffd700;
        margin-bottom: 2rem;
        text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
      }

      .loading-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(255, 215, 0, 0.3);
        border-top-color: #ffd700;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .loading-text {
        color: #fff;
        margin-top: 1rem;
        font-size: 1.2rem;
      }

      .loading-progress {
        width: 300px;
        height: 6px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 3px;
        margin-top: 1rem;
        overflow: hidden;
      }

      .loading-progress-bar {
        height: 100%;
        background: linear-gradient(90deg, #ffd700, #ffec8b);
        width: 0%;
        transition: width 0.3s ease;
      }
    </style>
  </head>
  <body>
    <div id="loading-screen">
      <div class="loading-logo">SRObro</div>
      <div class="loading-spinner"></div>
      <div class="loading-text">Loading...</div>
      <div class="loading-progress">
        <div class="loading-progress-bar" id="progress-bar"></div>
      </div>
    </div>
    <canvas id="renderCanvas" tabindex="0"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
