version: '3.9'

services:
  # PostgreSQL Database with Production Configuration
  postgres:
    image: postgres:15-alpine
    container_name: srobro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: srobro
      POSTGRES_PASSWORD: srobro123
      POSTGRES_DB: srobro
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
      # Connection pooling (Prisma 7 optimization)
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/database/init:/docker-entrypoint-initdb.d
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1" # SSD optimization
      - "-c"
      - "effective_io_concurrency=200" # SSD optimization
      - "-c"
      - "work_mem=1310kB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=4GB"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U srobro"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - srobro-network

  # Redis Cache with Session Store Configuration
  redis:
    image: redis:7-alpine
    container_name: srobro-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass srobro123 --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - srobro-network

  # SRObro Game Server (Development)
  server:
    build:
      context: .
      dockerfile: server/docker/Dockerfile
    container_name: srobro-server
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://srobro:srobro123@postgres:5432/srobro?connection_limit=20&pool_timeout=30
      REDIS_URL: redis://:srobro123@redis:6379
      PORT: 3001
      CLIENT_URL: http://localhost:3000
      TICK_RATE: 20
      MAX_PLAYERS: 100
      LOG_LEVEL: debug
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - srobro-network

  # Nginx Reverse Proxy (Production)
  nginx:
    image: nginx:alpine
    container_name: srobro-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./client/dist:/usr/share/nginx/html:ro
    depends_on:
      - server
    networks:
      - srobro-network
    profiles:
      - production

  # Adminer for Database Management (Development Only)
  adminer:
    image: adminer:latest
    container_name: srobro-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: nette
    depends_on:
      - postgres
    networks:
      - srobro-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  srobro-network:
    driver: bridge
